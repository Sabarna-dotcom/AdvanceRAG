global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "rag_api"
    static_configs:
      # Windows / macOS Docker Desktop: use host.docker.internal
      # Linux Docker: use 172.17.0.1 instead
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
